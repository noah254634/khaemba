<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Outer Dark Badge with Subtle Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0A0B0E" stroke="#E5C59E" stroke-width="2.5" />
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#E5C59E" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Monogram NK Typography -->
  <text 
    x="32" 
    y="41" 
    text-anchor="middle" 
    fill="#F4F4F6" 
    font-family="Space Mono, monospace, system-ui" 
    font-size="26" 
    font-weight="700" 
    letter-spacing="-1"
  >NK</text>
  
  <!-- Active Indicator Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#10B981" />
</svg>